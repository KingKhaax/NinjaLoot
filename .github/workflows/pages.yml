# Publica la versión web de NinjaLoot en GitHub Pages (https://kingkhaax.github.io/NinjaLoot/)
# con cada cambio en main, junto con las páginas de Condiciones del Servicio y Política de Privacidad.
name: Web

on:
  push:
    branches: [main]
    paths: ['src/**', 'web/**', 'tools/build-web.mjs', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/build-web.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
