# Compila NinjaLoot en GitHub, lo firma (con el certificado de Certum SimplySign o con SignPath, el que esté configurado) y publica la release.
# Se lanza solo al subir a main un cambio de la app (src/, main.js, package.json…) o a mano: Actions -> "Release" -> Run workflow.
# Si cambia la app sin subir la "version", avisa con una advertencia: ni la web ni los .exe se actualizan (así siempre son la misma versión).
# Al terminar la release publica también la web (GitHub Pages) con el mismo commit.
# Después borra las versiones anteriores (release y tag): solo queda la última.

name: Release

on:
  push:
    branches: [main]
    paths: [package.json, 'src/**', 'web/**', 'main.js', 'preload.js', 'tools/build-web.mjs']
  workflow_dispatch:
    inputs:
      sign:
        description: 'Firmar con SignPath'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency: release

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(jq -r .version package.json)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "push" ]; then
              # Se ha subido código de la app sin subir la versión: ni la web ni los .exe se actualizan; se avisa en el resumen pero sin fallar (así no llegan correos de error)
              echo "::warning title=Falta subir la versión::La app ha cambiado pero la versión v$v ya está publicada. La web y los .exe NO se actualizan hasta que subas 'version' en package.json."
              exit 0
            fi
            echo "::notice::La release v$v ya existe: no se publica nada (sube la versión en package.json)."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # Antes de publicar nada se pasan todas las pruebas; si una falla, no se publica ni la web ni los .exe
  tests:
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/tests.yml

  release:
    needs: [check, tests]
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar requisitos de SignPath
        shell: pwsh
        run: |
          if (-not (Test-Path LICENSE)) { throw "Falta el archivo LICENSE (lo exige SignPath)." }
          $readme = Get-Content README.md -Raw
          foreach ($s in 'Code signing policy', 'Free code signing provided by', 'Privacy policy') {
            if (-not $readme.Contains($s)) { throw "Falta '$s' en README.md (lo exige SignPath)." }
          }

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Versión
        id: ver
        shell: pwsh
        run: "'version=${{ needs.check.outputs.version }}' >> $env:GITHUB_OUTPUT"

      - name: Decidir si se firma
        id: sign
        shell: pwsh
        run: |
          $want = '${{ github.event_name }}' -eq 'push' -or '${{ inputs.sign }}' -eq 'true'
          $spReady = -not [string]::IsNullOrEmpty($env:SP_TOKEN) -and -not [string]::IsNullOrEmpty($env:SP_ORG)
          $ctReady = -not [string]::IsNullOrEmpty($env:CT_USER) -and -not [string]::IsNullOrEmpty($env:CT_TOTP)
          # Certum (certificado propio en SimplySign) tiene prioridad; si no está, SignPath; si ninguno, se compila SIN firmar
          $certum = $want -and $ctReady
          $on = $want -and -not $ctReady -and $spReady
          if ($want -and -not $ctReady -and -not $spReady) { "::warning::Ni Certum (CERTUM_USERNAME y CERTUM_TOTP_SECRET) ni SignPath (SIGNPATH_API_TOKEN y SIGNPATH_ORGANIZATION_ID) están configurados: se compila SIN firmar." }
          "on=$($on.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "certum=$($certum.ToString().ToLower())" >> $env:GITHUB_OUTPUT
        env:
          SP_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SP_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          CT_USER: ${{ secrets.CERTUM_USERNAME }}
          CT_TOTP: ${{ secrets.CERTUM_TOTP_SECRET }}

      - run: npm ci

      # 1) Empaquetar la app (sin instalador) y firmar NinjaLoot.exe
      - name: Empaquetar app
        run: npx electron-builder --win dir --publish never

      # Certum SimplySign: la sesión se abre una vez (código TOTP) y vale para firmar la app y, más abajo, los instaladores.
      # Los códigos TOTP son de un solo uso: la concurrencia «release» del workflow impide dos firmas a la vez.
      - name: Abrir sesión de firma (Certum SimplySign)
        if: steps.sign.outputs.certum == 'true'
        id: certum
        uses: jay0lee/certum-cloud-code-sign@a3324503499c49090869856eeeecfe95fb613d87
        with:
          username: ${{ secrets.CERTUM_USERNAME }}
          totp_secret: ${{ secrets.CERTUM_TOTP_SECRET }}

      - name: Firmar NinjaLoot.exe (Certum)
        if: steps.sign.outputs.certum == 'true'
        shell: pwsh
        run: |
          & "${{ steps.certum.outputs.signtool-path }}" sign /sha1 ${{ steps.certum.outputs.cert-thumbprint }} /tr http://time.certum.pl /td SHA256 /fd SHA256 "dist/win-unpacked/NinjaLoot.exe"
          if ($LASTEXITCODE) { throw "No se pudo firmar NinjaLoot.exe" }
          & "${{ steps.certum.outputs.signtool-path }}" verify /pa "dist/win-unpacked/NinjaLoot.exe"
          if ($LASTEXITCODE) { throw "La firma de NinjaLoot.exe no es válida" }

      - name: Subir NinjaLoot.exe sin firmar
        if: steps.sign.outputs.on == 'true'
        id: upload-app
        uses: actions/upload-artifact@v7
        with:
          name: app-unsigned
          path: dist/win-unpacked/NinjaLoot.exe

      - name: Firmar NinjaLoot.exe (SignPath)
        if: steps.sign.outputs.on == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'NinjaLoot' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app
          parameters: |
            version: ${{ toJSON(steps.ver.outputs.version) }}

      - name: Sustituir por el NinjaLoot.exe firmado
        if: steps.sign.outputs.on == 'true'
        shell: pwsh
        run: Copy-Item signed-app/NinjaLoot.exe dist/win-unpacked/NinjaLoot.exe -Force

      # 2) Instalador y portable a partir de la app ya firmada, y firmarlos
      - name: Crear instalador y portable
        run: npx electron-builder --win nsis portable --prepackaged dist/win-unpacked --publish never

      - name: Firmar instalador y portable (Certum)
        if: steps.sign.outputs.certum == 'true'
        shell: pwsh
        run: |
          foreach ($f in @("dist/NinjaLoot v${{ steps.ver.outputs.version }} Setup.exe", "dist/NinjaLoot v${{ steps.ver.outputs.version }}.exe")) {
            & "${{ steps.certum.outputs.signtool-path }}" sign /sha1 ${{ steps.certum.outputs.cert-thumbprint }} /tr http://time.certum.pl /td SHA256 /fd SHA256 $f
            if ($LASTEXITCODE) { throw "No se pudo firmar $f" }
            & "${{ steps.certum.outputs.signtool-path }}" verify /pa $f
            if ($LASTEXITCODE) { throw "La firma de $f no es válida" }
          }

      - name: Cerrar sesión de firma (Certum)
        if: always() && steps.sign.outputs.certum == 'true'
        uses: jay0lee/certum-cloud-code-sign/teardown@a3324503499c49090869856eeeecfe95fb613d87

      - name: Subir instaladores sin firmar
        if: steps.sign.outputs.on == 'true'
        id: upload-installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-unsigned
          path: |
            dist/NinjaLoot v${{ steps.ver.outputs.version }} Setup.exe
            dist/NinjaLoot v${{ steps.ver.outputs.version }}.exe

      - name: Firmar instalador y portable (SignPath)
        if: steps.sign.outputs.on == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'NinjaLoot' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installers
          parameters: |
            version: ${{ toJSON(steps.ver.outputs.version) }}

      - name: Reunir ficheros finales
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $src = if ('${{ steps.sign.outputs.on }}' -eq 'true') { 'signed-installers' } else { 'dist' }
          New-Item -ItemType Directory -Force out | Out-Null
          # Mismos nombres que GitHub da a los assets (espacios -> puntos): latest.yml tiene que coincidir
          $setup = "NinjaLoot.v$v.Setup.exe"
          Copy-Item "$src/NinjaLoot v$v Setup.exe" "out/$setup"
          Copy-Item "$src/NinjaLoot v$v.exe" "out/NinjaLoot.v$v.exe"
          # latest.yml + .blockmap del instalador ya firmado: electron-updater descarga solo lo que cambia
          node tools/update-info.js out $setup $v
          if ($LASTEXITCODE) { throw "No se pudo generar latest.yml" }
          Get-ChildItem out/*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content out/SHA256SUMS.txt -Encoding utf8
          Get-Content out/SHA256SUMS.txt

      # 3) Publicar la release (las notas son el mensaje del commit que subió la versión)
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NinjaLoot v${{ steps.ver.outputs.version }}
          body: ${{ github.event.head_commit.message }}
          draft: false
          make_latest: true
          files: out/*

      # 4) Solo queda la release actual: las anteriores se borran del todo, con su tag.
      - name: Borrar las versiones anteriores
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $new = 'v${{ steps.ver.outputs.version }}'
          $rels = @(gh release list --limit 100 --json tagName,isDraft | ConvertFrom-Json |
            Where-Object { $_.tagName -ne $new })
          foreach ($r in $rels) {
            gh release delete $r.tagName --cleanup-tag -y
            "Borrada $($r.tagName)"
          }

  # La web se publica DESPUÉS de la release y con el mismo commit: así la web, el instalador y el portable son siempre la misma versión.
  web:
    needs: [check, release]
    if: ${{ needs.release.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  # Misma versión en la web de Vercel (si el repositorio tiene el secreto VERCEL_TOKEN)
  vercel:
    needs: [check, release]
    if: ${{ needs.release.result == 'success' }}
    uses: ./.github/workflows/vercel.yml
    secrets: inherit
