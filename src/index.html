<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://wow.zamimg.com https://assets.rpglogs.com; style-src 'self' 'unsafe-inline'; script-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NinjaLoot</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="personal.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="assets/logo.png" alt="" class="brand-icon">
    <div><h1>NinjaLoot</h1></div>
  </div>
  <nav class="nav">
    <a class="navbtn" href="#/" data-view="home"><img class="uiicon" src="assets/ui/home.png" alt=""><span id="navHome"></span></a>
    <a class="navbtn" href="#/tiers" data-view="tiers"><img class="uiicon" src="assets/ui/tiers.png" alt=""><span id="navTiers"></span></a>
    <a class="navbtn" href="#/personal" data-view="personal"><img class="uiicon" src="assets/ui/personal.png" alt=""><span id="navPers"></span></a>
    <a class="navbtn" href="#/charts" data-view="charts"><img class="uiicon" src="assets/ui/charts.png" alt=""><span id="navCharts"></span></a>
    <a class="navbtn" href="#/rotations" data-view="rotations"><img class="uiicon" src="assets/ui/rotations.png" alt=""><span id="navRot"></span></a>
    <a class="navbtn" href="#/roster" data-view="roster"><img class="uiicon" src="assets/ui/roster.png" alt=""><span id="navRoster"></span></a>
  </nav>
  <div class="top-actions">
    <div class="langwrap"><button id="btnLang" class="btn ghost" aria-label="Languages" aria-haspopup="true"><img class="uiicon" src="assets/ui/lang.png" alt=""><span id="langLabel"></span></button><div id="langMenu" class="langmenu" hidden></div></div>
    <button id="verBadge" class="verbadge na" hidden></button>
    <button id="btnSettings" class="btn ghost" aria-label="Settings"><img class="uiicon" src="assets/ui/settings.png" alt=""></button>
  </div>
</header>

<main>
  <div id="chartsTools">
    <section class="adder panel">
      <textarea id="urlInput" rows="2" spellcheck="false"></textarea>
      <div class="adder-actions">
        <button id="btnAdd" class="btn primary"></button>
        <button id="btnPaste" class="btn"></button>
        <button id="btnLoot" class="btn"></button>
        <button id="btnSessions" class="btn"></button>
        <button id="btnShare" class="btn"></button>
        <button id="btnExportData" class="btn"></button>
        <button id="btnClear" class="btn danger"></button>
      </div>
    </section>
    <div id="chips" class="chips"></div>
  </div>
  <div id="content"></div>
</main>

<div id="toasts" class="toasts"></div>
<div id="modalRoot"></div>

<script src="servertime.js"></script>
<script src="i18n.js"></script>
<script src="i18n-extra.js"></script>
<script src="data/classes.js"></script>
<script src="data/buffs.js"></script>
<script src="data/bosses.js"></script>
<script src="data/bossicons.js"></script>
<script src="data/items.js"></script>
<script src="data/tiers.js"></script>
<script src="data/armor.js"></script>
<script src="data/changelog.js"></script>
<script src="chart.js"></script>
<script src="app.js"></script>
<script src="polish.js"></script>
<script src="guard.js"></script>
</body>
</html>
