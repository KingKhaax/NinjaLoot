  <div class="top-actions">
    <div class="langwrap"><button id="btnLang" class="btn ghost" aria-label="Languages" aria-haspopup="true"><svg class="navic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span id="langLabel"></span></button><div id="langMenu" class="langmenu" hidden></div></div>

    <button id="btnSettings" class="btn ghost" aria-label="Settings"><svg class="navic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg></button>

  <div id="chartsTools">
    <section class="adder panel">
      <textarea id="urlInput" rows="2" spellcheck="false"></textarea>
      <div class="adder-actions">
        <button id="btnAdd" class="btn primary"></button>
        <button id="btnPaste" class="btn"></button>
        <button id="btnLoot" class="btn"></button>
        <button id="btnSessions" class="btn"></button>
        <button id="btnShare" class="btn"></button>
        <button id="btnExportData" class="btn"></button>
        <button id="btnClear" class="btn danger"></button>
      </div>
    </section>
    <div id="chips" class="chips"></div>
  </div>
  <div id="content"></div>
</main>

<div id="toasts" class="toasts"></div>
<div id="modalRoot"></div>

<script src="i18n.js"></script>
